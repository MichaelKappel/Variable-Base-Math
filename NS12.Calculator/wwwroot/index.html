<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Protocol5 mathematics tools powered by the NS12 variable-base providers." />
    <title>Protocol5 Mathematics Tools</title>
    <base href="/" />
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body.matrix-loading {
            overflow: hidden;
            background: #000000;
            color: #8efda2;
        }

        body.matrix-loading::before,
        body.matrix-loading::after {
            display: none !important;
        }

        body.matrix-loading #app {
            min-height: 100vh;
        }

        body.matrix-loading .matrix-loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow: hidden;
            background: #000000;
            color: #8efda2;
            font-family: "Cascadia Mono", Consolas, "Lucida Console", monospace;
        }

        body.matrix-loading .matrix-loader__canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        body.matrix-loading .matrix-loader__hud {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            width: min(42rem, 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 0.55rem;
            padding: 1.25rem;
        }

        body.matrix-loading .matrix-loader__hud > * {
            margin: 0;
        }

        body.matrix-loading .matrix-loader__eyebrow {
            color: rgba(167, 255, 181, 0.78);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        body.matrix-loading .matrix-loader__title {
            color: #e1ffe8;
            font-size: clamp(1.1rem, 1.4vw + 0.75rem, 1.5rem);
            line-height: 1.5;
        }

        body.matrix-loading .matrix-loader__copy,
        body.matrix-loading .matrix-loader__legend {
            color: rgba(181, 255, 193, 0.78);
            line-height: 1.6;
        }

        body.matrix-loading .matrix-loader__legend {
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        body.matrix-loading .matrix-loader__progress {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            min-height: 2.6rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid rgba(142, 253, 162, 0.24);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.48);
            color: #c8ffd2;
        }

        body.matrix-loading .matrix-loader__progress::after {
            content: var(--blazor-load-percentage-text, "Loading Protocol5 mathematics");
        }
    </style>
    <link rel="stylesheet" href="/css/app.css" />
</head>

<body class="matrix-loading">
    <div id="app">
        <div class="matrix-loader" data-matrix-loader role="status" aria-live="polite" aria-label="Loading Protocol5 mathematics tools">
            <canvas class="matrix-loader__canvas" data-matrix-canvas aria-hidden="true"></canvas>
            </div>
        </div>

    <div id="blazor-error-ui" hidden>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
        <pre id="blazor-error-details" hidden></pre>
    </div>

    <script src="/js/matrix-loader.js"></script>
    <script>
        (function () {
            var isLocalDevelopment = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
            var errorUi = document.getElementById("blazor-error-ui");
            var errorDetails = document.getElementById("blazor-error-details");
            var bootLoader = document.querySelector("[data-matrix-loader]");
            var finishTimer = 0;
            var stopBootLoader = typeof window.Protocol5BootLoader !== "undefined"
                ? window.Protocol5BootLoader.start(bootLoader)
                : function () { };

            function finishBootLoader() {
                if (!bootLoader || bootLoader.classList.contains("is-fading")) {
                    document.body.classList.remove("matrix-loading");
                    return;
                }

                document.body.classList.remove("matrix-loading");
                window.requestAnimationFrame(function () {
                    bootLoader.classList.add("is-fading");
                });
                window.clearTimeout(finishTimer);
                finishTimer = window.setTimeout(function () {
                    stopBootLoader();
                    bootLoader.hidden = true;
                }, 5000);
            }

            function appendBlazorScript(src) {
                var script = document.createElement("script");
                script.src = src;
                script.setAttribute("autostart", "false");
                script.onload = function () {
                    window.Blazor.start()
                        .then(function () {
                            finishBootLoader();
                        })
                        .catch(function (error) {
                            showErrorDetails(error && error.stack ? error.stack : String(error));
                            throw error;
                        });
                };
                document.body.appendChild(script);
            }

            function showErrorDetails(message) {
                if (!message) {
                    return;
                }

                if (errorUi) {
                    errorUi.hidden = false;
                    errorUi.style.display = "block";
                }

                if (isLocalDevelopment && errorDetails) {
                    errorDetails.hidden = false;
                    errorDetails.textContent = message;
                }
            }

            window.addEventListener("error", function (event) {
                var message = event && event.message ? event.message : "Unknown browser error.";
                var source = event && event.filename ? " (" + event.filename + ":" + event.lineno + ":" + event.colno + ")" : "";
                showErrorDetails(message + source);
            });

            window.addEventListener("unhandledrejection", function (event) {
                var reason = event && event.reason ? event.reason : "Unknown unhandled rejection.";
                var message = reason && reason.message ? reason.message : String(reason);
                var stack = reason && reason.stack ? "\n" + reason.stack : "";
                showErrorDetails(message + stack);
            });

            appendBlazorScript("/_framework/blazor.webassembly.js");
        })();
    </script>
</body>

</html>
