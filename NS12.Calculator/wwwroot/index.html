<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Protocol5 mathematics tools powered by the NS12 variable-base providers." />
    <title>Protocol5 Mathematics Tools</title>
    <base href="/" />
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body.boot-loading {
            overflow: hidden;
            background: #06131a;
            color: #e8fbf5;
        }

        body.boot-loading::before,
        body.boot-loading::after {
            display: none !important;
        }

        body.boot-loading #app {
            min-height: 100vh;
        }

        body.boot-loading .boot-loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 18%, rgba(12, 143, 122, 0.28) 0, rgba(12, 143, 122, 0) 28%),
                radial-gradient(circle at 82% 16%, rgba(31, 90, 224, 0.22) 0, rgba(31, 90, 224, 0) 26%),
                radial-gradient(circle at 50% 74%, rgba(216, 132, 52, 0.16) 0, rgba(216, 132, 52, 0) 28%),
                linear-gradient(180deg, #071019 0%, #06121a 42%, #09161c 100%);
        }

        body.boot-loading .boot-loader__canvas,
        body.boot-loading .boot-loader__layout {
            position: absolute;
            inset: 0;
        }

        body.boot-loading .boot-loader__canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <link rel="stylesheet" href="/css/app.css" />
</head>

<body class="boot-loading">
    <div id="app">
        <div class="boot-loader" data-boot-loader role="status" aria-live="polite" aria-label="Loading Protocol5 mathematics tools">
            <canvas class="boot-loader__canvas" data-boot-canvas aria-hidden="true"></canvas>
            <div class="boot-loader__layout" aria-hidden="true">
                <section class="boot-loader__panel boot-loader__panel--north" data-boot-panel="convert">
                    <div class="boot-loader__panel-head">
                        <span class="boot-loader__panel-chip" data-panel-primary>&lt;-&gt;</span>
                        <span class="boot-loader__panel-chip" data-panel-secondary>2.10.16</span>
                    </div>
                    <p class="boot-loader__panel-value" data-panel-line-a></p>
                    <p class="boot-loader__panel-value boot-loader__panel-value--soft" data-panel-line-b></p>
                </section>

                <section class="boot-loader__panel boot-loader__panel--west" data-boot-panel="arithmetic">
                    <div class="boot-loader__panel-head">
                        <span class="boot-loader__panel-chip" data-panel-primary>+</span>
                        <span class="boot-loader__panel-chip" data-panel-secondary>16</span>
                    </div>
                    <p class="boot-loader__panel-value" data-panel-line-a></p>
                    <p class="boot-loader__panel-value boot-loader__panel-value--soft" data-panel-line-b></p>
                </section>

                <div class="boot-loader__engine">
                    <div class="boot-loader__orbit">
                        <span class="boot-loader__node" data-radix-node="2" style="--angle:-90deg; --node-color:#82efe0; --delay:0s;">2</span>
                        <span class="boot-loader__node" data-radix-node="8" style="--angle:-28deg; --node-color:#8ce0ff; --delay:0.25s;">8</span>
                        <span class="boot-loader__node" data-radix-node="10" style="--angle:28deg; --node-color:#f3fbff; --delay:0.5s;">10</span>
                        <span class="boot-loader__node" data-radix-node="16" style="--angle:86deg; --node-color:#ffd191; --delay:0.75s;">16</span>
                        <span class="boot-loader__node" data-radix-node="36" style="--angle:148deg; --node-color:#9fb6ff; --delay:1s;">36</span>
                        <span class="boot-loader__node boot-loader__node--wide" data-radix-node="63404" style="--angle:214deg; --node-color:#8ef5c1; --delay:1.25s;">63404</span>
                    </div>
                    <div class="boot-loader__core">
                        <div class="boot-loader__core-stack">
                            <span class="boot-loader__core-value" data-boot-core-value>2D</span>
                            <span class="boot-loader__core-meta" data-boot-core-meta>45<sub>10</sub> -&gt; 2D<sub>16</sub></span>
                        </div>
                    </div>
                </div>

                <section class="boot-loader__panel boot-loader__panel--east" data-boot-panel="division">
                    <div class="boot-loader__panel-head">
                        <span class="boot-loader__panel-chip" data-panel-primary>/</span>
                        <span class="boot-loader__panel-chip" data-panel-secondary>10</span>
                    </div>
                    <p class="boot-loader__panel-value" data-panel-line-a></p>
                    <p class="boot-loader__panel-value boot-loader__panel-value--soft" data-panel-line-b></p>
                </section>

                <section class="boot-loader__panel boot-loader__panel--south" data-boot-panel="glyph">
                    <div class="boot-loader__panel-head">
                        <span class="boot-loader__panel-chip" data-panel-primary>63404</span>
                        <span class="boot-loader__panel-chip" data-panel-secondary>10</span>
                    </div>
                    <p class="boot-loader__panel-value" data-panel-line-a></p>
                    <p class="boot-loader__panel-value boot-loader__panel-value--soft" data-panel-line-b></p>
                </section>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" hidden>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
        <pre id="blazor-error-details" hidden></pre>
    </div>

    <script src="/js/protocol5-loader.js"></script>
    <script>
        (function () {
            var isLocalDevelopment = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
            var errorUi = document.getElementById("blazor-error-ui");
            var errorDetails = document.getElementById("blazor-error-details");
            var bootLoader = document.querySelector("[data-boot-loader]");
            var finishTimer = 0;
            var stopBootLoader = typeof window.Protocol5BootLoader !== "undefined"
                ? window.Protocol5BootLoader.start(bootLoader)
                : function () { };

            function finishBootLoader() {
                if (!bootLoader || bootLoader.classList.contains("is-fading")) {
                    document.body.classList.remove("boot-loading");
                    return;
                }

                document.body.classList.remove("boot-loading");
                window.requestAnimationFrame(function () {
                    bootLoader.classList.add("is-fading");
                });
                window.clearTimeout(finishTimer);
                finishTimer = window.setTimeout(function () {
                    stopBootLoader();
                    bootLoader.hidden = true;
                }, 5000);
            }

            function appendBlazorScript(src) {
                var script = document.createElement("script");
                script.src = src;
                script.setAttribute("autostart", "false");
                script.onload = function () {
                    window.Blazor.start()
                        .then(function () {
                            finishBootLoader();
                        })
                        .catch(function (error) {
                            showErrorDetails(error && error.stack ? error.stack : String(error));
                            throw error;
                        });
                };
                document.body.appendChild(script);
            }

            function showErrorDetails(message) {
                if (!message) {
                    return;
                }

                if (errorUi) {
                    errorUi.hidden = false;
                    errorUi.style.display = "block";
                }

                if (isLocalDevelopment && errorDetails) {
                    errorDetails.hidden = false;
                    errorDetails.textContent = message;
                }
            }

            window.addEventListener("error", function (event) {
                var message = event && event.message ? event.message : "Unknown browser error.";
                var source = event && event.filename ? " (" + event.filename + ":" + event.lineno + ":" + event.colno + ")" : "";
                showErrorDetails(message + source);
            });

            window.addEventListener("unhandledrejection", function (event) {
                var reason = event && event.reason ? event.reason : "Unknown unhandled rejection.";
                var message = reason && reason.message ? reason.message : String(reason);
                var stack = reason && reason.stack ? "\n" + reason.stack : "";
                showErrorDetails(message + stack);
            });

            appendBlazorScript("/_framework/blazor.webassembly.js");
        })();
    </script>
</body>

</html>
